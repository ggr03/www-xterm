<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WWW-Xterm - Log in</title>
    <link rel="stylesheet" href="wt_style.css">
</head>
<body class="login-body">
    <form id="login-form" class="login-card" autocomplete="off">
        <h1 class="login-title">WWW-Xterm</h1>
        <p class="login-subtitle">Log in as <strong>{{USERNAME}}</strong></p>
        <input
            id="password"
            name="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            autofocus
            required
        />
        <button type="submit">Log in</button>
        <p id="login-error" class="login-error" hidden></p>
    </form>

    <script>
        const form = document.getElementById('login-form');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.hidden = true;

            const submitBtn = form.querySelector('button');
            submitBtn.disabled = true;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await res.json().catch(() => ({}));

                if (res.ok && data.ok) {
                    window.location.href = '/';
                    return;
                }

                errorEl.textContent = data.error || 'Login failed.';
                errorEl.hidden = false;
                passwordInput.value = '';
                passwordInput.focus();
            } catch (err) {
                errorEl.textContent = 'Could not reach the server.';
                errorEl.hidden = false;
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
